<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Image Gallery</h1>
        <p>
            Explore beautiful collections of sky, sea and moon photography.
            Click images to view them in fullscreen.
        </p>
    </header>
    <div class="filterbtn">
        <button class="btn active" onclick="filterImages('all')">All</button>
        <button class="btn" onclick="filterImages('sky')">Sky</button>
        <button class="btn" onclick="filterImages('sea')">Sea</button>
        <button class="btn" onclick="filterImages('moon')">Moon</button>
    </div>
    <div class="gallery">

    <div class="gallery-item sky">
        <img src="images/img1.jpeg" alt="Image 1">
        
    </div>
    <div class="gallery-item sky">
        <img src="images/img2.jpeg" alt="Image 2">

    </div>
    <div class="gallery-item sky">
        <img src="images/img3.jpeg" alt="Image 3">

    </div>
    <div class="gallery-item sea">
        <img src="images/img4.jpeg" alt="Image 4">

    </div>
    <div class="gallery-item sky">
        <img src="images/img5.jpeg" alt="Image 5">
        
    </div>
     <div class="gallery-item moon">
        <img src="images/img6.jpeg" alt="Image 6">
    </div>
    <div class="gallery-item moon">
        <img src="images/img7.jpeg" alt="Image 7">
    </div>
    <div class="gallery-item moon">
        <img src="images/img8.jpeg" alt="Image 8">
    </div>
    <div class="gallery-item sky">
        <img src="images/img9.jpeg" alt="Image 9">
    </div>
   <div class="gallery-item moon">
        <img src="images/img10.jpeg" alt="Image 10">
    </div>
    <div class="gallery-item moon">
        <img src="images/img11.jpeg" alt="Image 11">
    </div>
    <div class="gallery-item sea">
        <img src="images/img12.jpg" alt="Image 12">
    </div>

    </div>
<div class="lightbox" id="lightbox">

    <span class="close">&times;</span>

    <span class="prev">&#10094;</span>

    <img id="lightbox-img" src="" alt="">

    <span class="next">&#10095;</span>

  </div>

  <script>
    const galleryimg = document.querySelectorAll(".gallery-item img");
    const lightbox = document.getElementById("lightbox");
    const lightboximg = document.getElementById("lightbox-img");

    const closebtn =document.querySelector(".close");
    const nextbtn = document.querySelector(".next");
    const prevbtn = document.querySelector(".prev");

    let currentIndex = 0;

   galleryimg.forEach((img, index) => {

      img.addEventListener("click", () => {

        currentIndex = index;
        showimg();

        lightbox.style.display = "flex";
      });

    });

    function showimg(){
        lightboximg.src = galleryimg[currentIndex].src;
    }

     nextbtn.addEventListener("click", () => {

      currentIndex++;

      if(currentIndex >= galleryimg.length){
        currentIndex = 0;
      }

      showimg();

    });

     prevbtn.addEventListener("click", () => {

      currentIndex--;

      if(currentIndex < 0){
        currentIndex = galleryimg.length - 1;
      }

      showimg();

    });

    closebtn.addEventListener("click", () => {
        lightbox.style.display ="none"

    });
    
     lightbox.addEventListener("click", (e) => {

      if(e.target !== lightboximg &&
         e.target !== nextbtn &&
         e.target !== prevbtn){

        lightbox.style.display = "none";
      }

    });

    function filterImages(category){

      const items = document.querySelectorAll(".gallery-item");

      items.forEach(item => {

        if(category === "all"){
          item.style.display = "block";
        }

        else if(item.classList.contains(category)){
          item.style.display = "block";
        }

        else{
          item.style.display = "none";
        }

      });

    }


  </script>  
</body>
</html>
